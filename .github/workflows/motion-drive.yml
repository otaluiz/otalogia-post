# Renderiza os carrosséis com motion (carrosseis/*/motion/index.html) e entrega no Drive na ordem de postagem:
# slide-01.png (hook estático) + slide-02.mp4.. (hook animado e os demais). Disparo manual; "carrosseis" vazio = todos.
# "so_organizar" pula o render e só reorganiza as pastas do Drive que já têm vídeo.
name: motion -> drive
on:
  workflow_dispatch:
    inputs:
      carrosseis:
        description: "slugs separados por espaço (vazio = todos)"
        type: string
        default: ""
      so_organizar:
        description: "só reorganizar as pastas do Drive (sem render)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: drive
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !inputs.so_organizar }}
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: ${{ !inputs.so_organizar }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: ${{ !inputs.so_organizar }}
        run: pip install -q google-api-python-client google-auth numpy opencv-python-headless==4.10.0.84 pillow playwright && python -m playwright install --with-deps chromium
      - if: ${{ inputs.so_organizar }}
        run: pip install -q google-api-python-client google-auth
      - name: renderiza
        if: ${{ !inputs.so_organizar }}
        run: |
          for d in carrosseis/*/motion/index.html; do
            slug=$(basename "$(dirname "$(dirname "$d")")")
            if [ -n "${{ inputs.carrosseis }}" ] && ! grep -qw "$slug" <<< "${{ inputs.carrosseis }}"; then continue; fi
            bash motor/hyperframes/render.sh "carrosseis/$slug" > render.log 2>&1 || { tail -30 render.log; exit 1; }
            tail -1 render.log
          done
      - name: sobe para o Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python automation/subir_motion_drive.py ${{ inputs.so_organizar && '--so-organizar' || '' }} ${{ inputs.carrosseis }}
