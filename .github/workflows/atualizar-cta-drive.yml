# Sobe para o Drive o CTA (halftone) e o slide 3 (quadro-negro) atuais dos carrosséis já enviados. Disparo manual; dry_run só lista.
name: atualizar CTA e slide 3 no drive
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "só listar, sem gravar"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: drive
jobs:
  cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: atualiza o CTA no Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python automation/atualizar_cta_drive.py ${{ inputs.dry_run && '--dry-run' || '' }}
