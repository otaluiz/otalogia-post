name: post-instagram

# Publica o próximo carrossel aprovado (Drive 06-Aprovados-para-Postar) no @otalogia.
# Disparos escalonados: o agendador do GitHub atrasa; o publicador espera 06:00 Cuiabá
# e a trava diária (consulta à Graph API) impede post duplicado.
on:
  schedule:
    - cron: '42 8 * * *'   # 04:42 Cuiabá
    - cron: '23 9 * * *'
    - cron: '7 10 * * *'
    - cron: '47 10 * * *'
    - cron: '29 11 * * *'
  workflow_dispatch:
    inputs:
      carousel_folder:
        description: 'Pasta em fila/ (vazio = próximo da fila)'
        required: false
        default: ''
  repository_dispatch:
    types: [daily_publish]

permissions:
  contents: write

concurrency:
  group: post-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: publicador/requirements.txt
      - run: pip install -r publicador/requirements.txt
      - name: Publicar no Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_MEDIA_BUCKET: instagram-carousels
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID || secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET || secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN || secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID_OTALOGIA: ${{ secrets.GDRIVE_FOLDER_ID_OTALOGIA }}
          PASTA: ${{ github.event.inputs.carousel_folder }}
        run: |
          if [ -n "$PASTA" ]; then
            python publicador/instagram_publisher.py --dir "fila/$PASTA"
          else
            python publicador/instagram_publisher.py --auto-next --queue-dir fila
          fi
      - name: Registrar estado na fila (só texto)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fila/ ':!fila/**/*.png' ':!fila/**/*.mp4' ':!fila/**/*.jpg'
          git diff --cached --quiet || git commit -m "chore(post-instagram): registrar carrossel publicado [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
